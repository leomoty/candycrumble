<style>
:root{
  --bg:#E9F3EE; --surface:#FFFFFF; --ink:#2B1D3A; --muted:#6B607C; --line:#B4A9C2;
  --cherry:#D6336C; --cherry-ink:#FFFFFF;
  --slot-w:176px; --slot-h:38px; --cell:46px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1524; --surface:#2A2135; --ink:#F2ECF7; --muted:#A99CBA; --line:#56496A;
    --cherry:#FF5C8F; --cherry-ink:#1B1524; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1524; --surface:#2A2135; --ink:#F2ECF7; --muted:#A99CBA; --line:#56496A;
  --cherry:#FF5C8F; --cherry-ink:#1B1524; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.3}
:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.status{margin:0;color:var(--muted);font-size:14px;flex:1 1 320px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:var(--ink)}
.zoom{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.error{margin:20px;padding:16px;border-radius:12px;background:var(--surface);border:1.5px solid var(--cherry);max-width:60ch}

.wrap{overflow:auto;padding:28px 20px 48px}
.sizer{position:relative}
.board{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;gap:30px;padding:8px}
.lines{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.lines path{fill:none;stroke:var(--line);stroke-width:2}
.lines path.hot{stroke:var(--cherry);stroke-width:3}

.col{display:flex;flex-direction:column;width:var(--slot-w)}
.slots{height:calc(32 * var(--cell));display:flex;flex-direction:column}
.cell{flex:1;display:flex;align-items:center}

.slot{width:100%;height:var(--slot-h);display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:10px;text-align:left;position:relative;z-index:1;border:1.5px solid var(--line);background:var(--surface)}
.slot:disabled{cursor:default}
.slot.empty{background:transparent;border-style:dashed}
.slot.won{border-color:var(--cherry);box-shadow:inset 4px 0 0 var(--cherry)}
.slot.out{opacity:.4}
.slot.out .name{text-decoration:line-through}
.right .slot{flex-direction:row-reverse;padding:3px 3px 3px 10px;text-align:right}
.right .slot.won{box-shadow:inset -4px 0 0 var(--cherry)}
.thumb{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#2B1D3A;overflow:hidden}
.thumb.pic{background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:contain}
.slot.empty .thumb{background:transparent}
.name{overflow:hidden;min-width:0;font-size:13.5px;line-height:1.12;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow-wrap:anywhere}

.center{display:flex;flex-direction:column}
.center .slots{justify-content:center;align-items:center}
.final-row{display:flex;align-items:center;gap:30px}
.final-row .slot{width:var(--slot-w)}
.champ{width:var(--slot-w);position:relative;z-index:1}
.champ-label{position:absolute;left:0;right:0;bottom:calc(100% + 6px);text-align:center;font-size:15px;font-weight:600}

.show-controls{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;opacity:.7}
body.clean .bar{display:none}
body.clean .show-controls{display:block}
</style>
</head>
<body>
<header class="bar">
  <p class="status" id="status"></p>
  <div class="tools">
    <button id="resetBtn">Clear my picks</button>
    <label class="zoom">Zoom
      <select id="zoom">
        <option value="fit">Fit</option><option value="0.5">50%</option>
        <option value="0.75">75%</option><option value="1">100%</option>
      </select>
    </label>
    <button id="cleanBtn">Hide controls</button>
  </div>
</header>
<main class="wrap" id="wrap"><div class="sizer" id="sizer"><div id="board" class="board"></div></div></main>
<button id="showBtn" class="show-controls">Show controls</button>

<script>
const ROUNDS = 6;
const ROUND_NAMES = ['Round of 64','Round of 32','Sweet 16','Elite 8','Final Four','Final','Champion'];
const SWATCHES = ['#F7A8C4','#FFD86B','#A8E0C8','#C4B5F5','#FFB38A','#9ED4F5'];
const $ = id => document.getElementById(id);
const board = $('board'), sizer = $('sizer'), wrap = $('wrap');

const entries = DATA;
const KEY = 'candy-bracket-picks-v1';
const SIG = entries.map(e => e.name).join('|');

function blankRounds(){
  const r = [];
  for (let k = 0; k <= ROUNDS; k++) r.push(new Array(64 >> k).fill(null));
  r[0] = [...Array(64).keys()];
  return r;
}
let state = { rounds: blankRounds(), zoom: 'fit' };
try{
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && s.sig === SIG && Array.isArray(s.rounds) && s.rounds.length === ROUNDS + 1) state = s;
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ ...state, sig: SIG })); }catch(e){} }
function hasResults(){ return state.rounds.slice(1).some(r => r.some(v => v != null)); }

function clearFrom(k, j){
  const v = state.rounds[k][j];
  state.rounds[k][j] = null;
  if (v != null && k < ROUNDS && state.rounds[k+1][j >> 1] === v) clearFrom(k+1, j >> 1);
}
function pick(k, i){
  const e = state.rounds[k][i], p = i >> 1;
  if (e == null || k >= ROUNDS) return;
  if (state.rounds[k+1][p] === e) clearFrom(k+1, p);
  else {
    if (state.rounds[k+1][p] != null) clearFrom(k+1, p);
    state.rounds[k+1][p] = e;
  }
  save(); render();
}

function letterThumb(t, name){
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  t.className = 'thumb';
  t.innerHTML = '';
  t.style.background = SWATCHES[h % SWATCHES.length];
  t.textContent = (name.match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase();
}
function thumbEl(entry){
  const t = document.createElement('span');
  t.className = 'thumb';
  if (!entry) return t;
  if (!entry.img){ letterThumb(t, entry.name); return t; }
  t.classList.add('pic');
  const img = document.createElement('img');
  img.alt = '';
  img.onerror = () => letterThumb(t, entry.name);
  img.src = entry.img;
  t.append(img);
  return t;
}
function slotEl(k, i){
  const e = state.rounds[k][i];
  const b = document.createElement('button');
  b.className = 'slot';
  b.dataset.k = k; b.dataset.i = i;
  const nameSpan = document.createElement('span'); nameSpan.className = 'name';
  if (e == null){
    b.classList.add('empty'); b.disabled = true;
    b.append(thumbEl(null), nameSpan);
    return b;
  }
  const name = entries[e].name;
  nameSpan.textContent = name;
  b.append(thumbEl(entries[e]), nameSpan);
  if (k < ROUNDS){
    const next = state.rounds[k+1][i >> 1];
    if (next === e){ b.classList.add('won'); b.setAttribute('aria-label', name + ', advanced. Activate to undo.'); }
    else if (next != null) b.classList.add('out');
    if (state.rounds[k][i ^ 1] == null) b.disabled = true;
    else if (next !== e) b.setAttribute('aria-label', 'Advance ' + name);
  } else b.disabled = true;
  b.title = name;
  return b;
}
function column(k, from, to, side){
  const c = document.createElement('div'); c.className = 'col ' + side;
  const body = document.createElement('div'); body.className = 'slots';
  for (let i = from; i < to; i++){
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.append(slotEl(k, i)); body.append(cell);
  }
  c.append(body);
  return c;
}
function render(){
  board.innerHTML = '';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.classList.add('lines'); svg.id = 'lines';
  board.append(svg);
  for (let k = 0; k <= 4; k++) board.append(column(k, 0, (64 >> k) / 2, 'left'));

  const center = document.createElement('div'); center.className = 'center';
  const body = document.createElement('div'); body.className = 'slots';
  const row = document.createElement('div'); row.className = 'final-row';
  const fla = document.createElement('div'); fla.className = 'left'; fla.append(slotEl(5, 0));
  const fra = document.createElement('div'); fra.className = 'right'; fra.append(slotEl(5, 1));
  const champ = document.createElement('div'); champ.className = 'champ';
  const cl = document.createElement('span'); cl.className = 'champ-label'; cl.textContent = 'Champion';
  champ.append(cl, slotEl(6, 0));
  row.append(fla, champ, fra); body.append(row); center.append(body);
  board.append(center);

  for (let k = 4; k >= 0; k--){ const n = 64 >> k; board.append(column(k, n / 2, n, 'right')); }

  updateStatus();
  requestAnimationFrame(() => { fitNames(); applyZoom(); drawLines(); });
}
function fitNames(){
  board.querySelectorAll('.name').forEach(n => {
    n.style.fontSize = ''; n.style.webkitLineClamp = ''; n.style.lineClamp = '';
    let s = 13.5;
    while (n.scrollHeight > n.clientHeight + 1 && s > 10.5){ s -= 0.5; n.style.fontSize = s + 'px'; }
    if (n.scrollHeight > n.clientHeight + 1){
      n.style.webkitLineClamp = '3'; n.style.lineClamp = '3';
      s = 11;
      n.style.fontSize = s + 'px';
      while (n.scrollHeight > n.clientHeight + 1 && s > 9){ s -= 0.5; n.style.fontSize = s + 'px'; }
    }
  });
}
function q(k, i){ return board.querySelector(`.slot[data-k="${k}"][data-i="${i}"]`); }
function rel(el){
  const br = board.getBoundingClientRect(), r = el.getBoundingClientRect();
  const s = br.width / board.offsetWidth || 1;
  return { l:(r.left - br.left) / s, r:(r.right - br.left) / s, cy:((r.top + r.bottom) / 2 - br.top) / s };
}
function drawLines(){
  const svg = $('lines'); if (!svg) return;
  svg.setAttribute('width', board.offsetWidth); svg.setAttribute('height', board.offsetHeight);
  let base = '', hot = '';
  for (let k = 0; k <= 4; k++){
    const n = 64 >> k;
    for (let p = 0; p < n / 2; p++){
      const A = rel(q(k, 2*p)), B = rel(q(k, 2*p + 1)), D = rel(q(k+1, p));
      const left = 2*p < n / 2;
      const sx = left ? Math.max(A.r, B.r) : Math.min(A.l, B.l);
      const dx = left ? D.l : D.r;
      const mx = (sx + dx) / 2;
      base += `M${sx} ${A.cy}H${mx}V${B.cy}M${sx} ${B.cy}H${mx}M${mx} ${D.cy}H${dx}`;
      const w = state.rounds[k+1][p];
      if (w != null){
        const wy = state.rounds[k][2*p] === w ? A.cy : B.cy;
        hot += `M${sx} ${wy}H${mx}V${D.cy}H${dx}`;
      }
    }
  }
  const L = rel(q(5,0)), R = rel(q(5,1)), C = rel(board.querySelector('.champ'));
  base += `M${L.r} ${L.cy}H${C.l}M${R.l} ${R.cy}H${C.r}`;
  const champ = state.rounds[6][0];
  if (champ != null) hot += state.rounds[5][0] === champ ? `M${L.r} ${L.cy}H${C.l}` : `M${R.l} ${R.cy}H${C.r}`;
  svg.innerHTML = `<path d="${base}"></path><path class="hot" d="${hot}"></path>`;
}
function updateStatus(){
  let done = 0;
  for (let k = 1; k <= ROUNDS; k++) done += state.rounds[k].filter(v => v != null).length;
  let cur = ROUNDS;
  for (let k = 0; k < ROUNDS; k++){ if (state.rounds[k+1].some(v => v == null)){ cur = k; break; } }
  const champ = state.rounds[6][0];
  $('status').textContent = champ != null
    ? `Your champion: ${entries[champ].name}. All 63 picks made.`
    : `${done} of 63 picks made. Click a candy to move it on, and click it again to undo.`;
}
function applyZoom(){
  const z = state.zoom || 'fit';
  $('zoom').value = z;
  const w = board.offsetWidth, h = board.offsetHeight;
  let s = z === 'fit' ? Math.min(1, (wrap.clientWidth - 40) / w) : parseFloat(z);
  s = Math.max(s, 0.2);
  board.style.transform = `scale(${s})`;
  sizer.style.width = (w * s) + 'px';
  sizer.style.height = (h * s) + 'px';
}

if (entries.length !== 64){
  document.body.innerHTML = `<div class="error">This bracket needs exactly 64 candies, but the list in the file has ${entries.length}. </div>`;
} else {
  $('zoom').addEventListener('change', e => { state.zoom = e.target.value; save(); applyZoom(); });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { applyZoom(); drawLines(); }, 120); });
  if (document.fonts) document.fonts.ready.then(() => { fitNames(); applyZoom(); drawLines(); });
  window.addEventListener('load', () => { applyZoom(); drawLines(); });
  board.addEventListener('click', e => {
    const b = e.target.closest('.slot'); if (!b || b.disabled) return;
    pick(+b.dataset.k, +b.dataset.i);
  });
  $('resetBtn').addEventListener('click', () => {
    if (!hasResults()) return;
    if (confirm('Clear all your picks and start over?')){ state.rounds = blankRounds(); save(); render(); }
  });
  $('cleanBtn').addEventListener('click', () => { document.body.classList.add('clean'); applyZoom(); drawLines(); });
  $('showBtn').addEventListener('click', () => { document.body.classList.remove('clean'); applyZoom(); drawLines(); });
  render();
}
</script>
</body>
</html>
